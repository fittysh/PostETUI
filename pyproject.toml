[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postetui"
version = "1.0.0"
description = "PostETUI - one terminal console for the Post-E PowerShell automation scripts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Fitri Shamsudin" }]
dependencies = [
    "textual==8.2.8",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyinstaller==6.22.3",
]

[project.scripts]
postetui = "postetui.__main__:main"

[tool.setuptools]
packages = ["postetui", "postetui.core", "postetui.widgets"]

[tool.setuptools.package-data]
postetui = ["assets/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
