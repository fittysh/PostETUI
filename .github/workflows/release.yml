# Push a tag like v1.0.1 to test, build postetui.exe and publish
# PostETUI-win64.zip as a GitHub release. The one-line installer always
# downloads the latest release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build exe and zip
        shell: cmd
        run: build.bat

      - name: Smoke-test the exe
        run: |
          dist\postetui.exe --version
          dist\postetui.exe --print-hashes
          dist\postetui.exe --smoke-test

      - uses: actions/upload-artifact@v7
        with:
          name: PostETUI-win64
          path: dist/PostETUI-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PostETUI-win64.zip --generate-notes --title "PostETUI ${{ github.ref_name }}"
